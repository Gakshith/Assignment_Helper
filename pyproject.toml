[project]
name = "assignment-helper"
version = "0.1.0"
description = "Render a document as handwriting on paper, then print or submit it."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Pinned exactly. --selftest asserts these versions at runtime (see docs/release.md).
# NOTE on watchfiles: dropped deliberately. It has no cp314 wheel and falls back to
# a Rust build. Plan §C.4 fallback doctrine says drop the dependency rather than move
# the Python pin. File watching is a stdlib mtime poll in server/watch.py instead.
# NOTE on uvicorn: plain, not [standard] — the extras pull watchfiles and uvloop.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "websockets==17.1",
  "pydantic==2.13.5",
  "img2pdf==0.6.3",
  "pillow==12.3.0",
  "anthropic==1.6.0",
  "keyring==25.7.0",
]

[project.optional-dependencies]
# The CV stack. Installed only for glyph extraction (M2).
# I17: these may NEVER be imported at module scope. Lazy-import inside
# function bodies under assignment_helper/glyphs/** only.
# Pins verified installable on cpython-3.14 arm64, 2026-09-17.
# scikit-image 0.26.0 is the FIRST release shipping cp314 wheels - 0.25.x builds from
# source via meson and fails. The pin moved forward because a real wheel exists; that
# is different from the watchfiles case above, where no wheel exists at any version
# and the fallback doctrine said to drop the dependency instead.
# opencv-python 5.0 is a major jump from the planned 4.10; cv2.aruco.ArucoDetector is
# unchanged and verified to construct.
glyphs = [
  "opencv-python==5.0.0.93",
  "scikit-image==0.26.0",
  "numpy==2.5.3",
]
dev = [
  "pytest",
  "pytest-asyncio",
  "hypothesis",
  "httpx",
  "import-linter",
  "ruff",
]

[project.scripts]
assignment-helper = "assignment_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assignment_helper"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Deliberate, not inherited. ISC is kept because ISC004 catches a missing comma in a
# list silently concatenating two entries into one - a real bug class, not a style nit.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ISC", "RUF"]
ignore = [
  "SIM102",  # nested ifs are often clearer when each tests a different concern
  "E501",    # line-length is enforced by the formatter, not by a second opinion
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# I17 enforcement. The render and serve paths must not import the CV stack.
[tool.importlinter]
root_package = "assignment_helper"
# Required because the forbidden modules (cv2, numpy, ...) are external packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The CV stack is never reachable from the serve or render path"
type = "forbidden"
source_modules = ["assignment_helper.app", "assignment_helper.cli", "assignment_helper.document", "assignment_helper.export"]
forbidden_modules = ["cv2", "skimage", "skan", "numba", "numpy"]

[[tool.importlinter.contracts]]
name = "spikes are never imported by the product"
type = "forbidden"
source_modules = ["assignment_helper"]
forbidden_modules = ["spikes"]
